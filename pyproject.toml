[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tenantdesk"
version = "0.1.0"
description = "Tenant-isolated knowledge assistants with quotas and durable conversations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.27,<1", "pydantic>=2.9,<3", "scikit-learn>=1.5"]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10"]
[project.scripts]
tenantdesk = "tenantdesk.cli:main"
[tool.setuptools.packages.find]
include = ["tenantdesk*"]
[tool.setuptools.package-data]
tenantdesk = ["*.sql", "*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
